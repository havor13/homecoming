<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homecoming is offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef3f0; color: #11231e; font-family: system-ui, sans-serif; padding: 16px; }
    main { max-width: 420px; background: #fff; border: 1px solid #d5e0db; border-radius: 16px; padding: 24px; }
    h1 { font-family: Georgia, serif; color: #0a4f43; margin: 0 0 12px; font-size: 28px; }
    button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: #0a4f43; color: #fff; font-size: 16px; font-weight: 600; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Homecoming needs an internet connection. Check your connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
